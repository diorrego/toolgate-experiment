[package]
name = "toolgate-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.50.0", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "=1.0.228", features = ["derive"] }

serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "=0.14.2"
jsonschema = { version = "=0.57.0", default-features = false }
sha2 = "=0.11.0"
hmac = "=0.13.0"
hex = "=0.4.3"
uuid = { version = "=1.22.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "serde"] }
unicode-normalization = "=0.1.25"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
